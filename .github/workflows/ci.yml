name: CI

# Verifie les tests et la compilation a chaque pull request et a chaque
# push sur main. Ne genere jamais d'installeur ni d'executable de release
# (regle 20 d'AGENTS.md) : uniquement tests + build.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Tests (dotnet test)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: dotnet test
        run: dotnet test Lumora.Tests/Lumora.Tests.csproj --configuration Release

  build-winui:
    name: Build WinUI (MSBuild)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2

      - name: Restore
        run: msbuild Lumora.WinUI/Lumora.WinUI.csproj /t:Restore /p:Configuration=Debug /p:Platform=x64

      - name: Build
        run: msbuild Lumora.WinUI/Lumora.WinUI.csproj /t:Build /p:Configuration=Debug /p:Platform=x64 /warnaserror
