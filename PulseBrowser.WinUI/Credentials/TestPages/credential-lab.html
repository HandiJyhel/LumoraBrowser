<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Pulse Credential Lab</title>
  <style>
    body { font-family: "Segoe UI", system-ui, sans-serif; margin: 32px; background: #111; color: #eee; }
    section { border: 1px solid #333; border-radius: 8px; padding: 18px; margin-bottom: 16px; max-width: 520px; }
    label { display: block; margin: 10px 0 4px; color: #bbb; }
    input { width: 100%; box-sizing: border-box; padding: 10px; border-radius: 6px; border: 1px solid #555; background: #191919; color: #fff; }
    button { margin-top: 12px; padding: 9px 14px; border-radius: 6px; border: 0; background: #d56a16; color: white; font-weight: 600; }
    .status { color: #8dd; margin-top: 10px; min-height: 20px; }
  </style>
</head>
<body>
  <h1>Pulse Credential Lab</h1>

  <section>
    <h2>Formulaire classique</h2>
    <form action="#classic-ok" method="post">
      <label>Email</label>
      <input type="email" name="email" autocomplete="username">
      <label>Mot de passe</label>
      <input type="password" name="password" autocomplete="current-password">
      <button type="submit">Connexion</button>
    </form>
  </section>

  <section>
    <h2>Connexion sans submit natif</h2>
    <label>Identifiant</label>
    <input id="spa-user" type="text" placeholder="email ou pseudo">
    <label>Mot de passe</label>
    <input id="spa-pass" type="password">
    <button type="button" onclick="document.querySelector('#spa-status').textContent='Connecte sans submit natif'; history.pushState({},'', '#spa-ok')">Connexion JS</button>
    <div id="spa-status" class="status"></div>
  </section>

  <section>
    <h2>Deux etapes</h2>
    <div id="step-user">
      <label>Email</label>
      <input id="two-user" type="email" autocomplete="username">
      <button type="button" onclick="document.querySelector('#step-user').style.display='none'; document.querySelector('#step-pass').style.display='block';">Continuer</button>
    </div>
    <div id="step-pass" style="display:none">
      <label>Mot de passe</label>
      <input id="two-pass" type="password" autocomplete="current-password">
      <button type="button" onclick="document.querySelector('#two-status').textContent='Connexion deux etapes terminee'; location.hash='two-step-ok';">Se connecter</button>
      <div id="two-status" class="status"></div>
    </div>
  </section>
</body>
</html>
